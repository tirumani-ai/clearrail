[project]
name = "clearrail"
version = "0.1.0"
description = "ClearRail: AI reads cross-border payment papers, plain code checks they agree"
requires-python = ">=3.12,<3.13"
# The first steps need only these (Gemini through langchain-google-genai).
dependencies = [
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-google-genai==4.4.2",
    "pydantic==2.14.1",
    "pypdf==6.21.1",
    "pypdfium2==5.14.0",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    # Step 4: a database, an API and a screen.
    "SQLAlchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "fastapi==0.156.4",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    # Step 5: a queue.
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false
